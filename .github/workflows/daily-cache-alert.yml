name: Daily Cache and Robots Check
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run cache/robots check
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
          NOTIFICATION_WEBHOOK_TYPE: ${{ secrets.NOTIFICATION_WEBHOOK_TYPE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check_google_cache.js

      - name: Commit updated state
        run: |
          git config user.name "citypaws-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/state/cache-status.json
          git diff --cached --quiet || git commit -m "chore: update cache-status.json"
          git push
